services:

    main:
        build:
            context: .
            dockerfile: services/main/build/Dockerfile
        container_name: crm_main
        entrypoint: bash entrypoint.sh
        volumes:
            - ./services/main/src/:/usr/src/app/:Z
        ports:
            - "8000:8000"
        env_file:
            - .env
        depends_on:
            - "main-db"
            - "minio"
    main-db:
        image: postgres:12.0-alpine
        volumes:
            - "main_postgres_data:${POSTGRES_DATA}"
        env_file:
            - .env
        ports:
            - "5432:5432"

    chats:
        build:
            context: .
            dockerfile: services/chats/build/Dockerfile
        container_name: crm_chats
        entrypoint: bash entrypoint.sh
        volumes:
            - ./services/chats/src/:/usr/src/app/:Z
        ports:
            - "8100:8100"
        env_file:
            - .env
        depends_on:
            - "chats-db"

    chats-db:
        image: postgres:12.0-alpine
        volumes:
            - "chats_postgres_data:${POSTGRES_DATA}"
        env_file:
            - .env
        ports:
            - "5542:5432"

    minio:
        image: minio/minio:latest
        command: server /data --console-address ":9001"
        ports:
            - '9000:9000'
            - '9001:9001'
        volumes:
            - 'minio_data:/data'
        env_file:
            - .env

volumes:
    main_postgres_data:
    minio_data:
    chats_postgres_data:



